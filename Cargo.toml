[workspace]
members = ["crates/core", "crates/app", "crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/willtfarrington/clauderoadmapwrangler"
publish = false

# Every crate the plan names, pinned to its exact version at EP-1 (D-15); a member opts in with
# `workspace = true` when a brief needs it, and `Cargo.lock` pins everything underneath. The egui
# family (eframe, egui, egui_tiles, egui_extras, egui_plot) and claude-codes move only in a re-plan
# brief.
[workspace.dependencies]
crw-core = { path = "crates/core" }

# The desktop: eframe with saved window state, docked tiles, tables (D-14, D-25). The icon font
# (added at EP-6, the research pass's pick) builds on egui and moves with the family; `image` is
# the version eframe already locks, for the screenshot feature's PNG.
eframe = { version = "=0.37.0", features = ["persistence"] }
# The chat's replies drawn as Markdown (D-27; EP-24a): built on egui 0.37, egui_extras 0.37 and
# the pulldown-cmark pinned below; no syntax highlighting and no image loading (D-15 addendum,
# 2026-11-11), and it moves with the family.
egui_commonmark = { version = "=0.26.0", default-features = false, features = ["pulldown_cmark"] }
egui_extras = "=0.37.0"
egui_material_icons = "=0.9.0"
egui_tiles = "=0.18.0"
image = { version = "=0.25.10", default-features = false, features = ["png"] }

# The session runner: protocol types behind an adapter, job objects (D-14, D-19). From EP-9:
# claude-codes brings its serde models only (the runner spawns and reads the child itself);
# process-wrap's tokio flavour is the one whose job object is killed when its handle closes;
# `windows` (the version process-wrap locks) names the no-window creation flag; uuid's v4 (the
# version claude-codes locks) makes the pre-assigned session id. From EP-11, `windows` also asks
# whether the process of a VS Code lock file still runs (the features process-wrap compiles in).
# From EP-12, tokio's `net` carries the window's loopback server. From EP-17, `windows` also
# makes the usage meter's one HTTPS request through WinHTTP, Windows' own HTTP stack (the owner's
# choice over a client crate).
claude-codes = { version = "=2.1.316", default-features = false, features = ["types"] }
process-wrap = { version = "=10.0.1", default-features = false, features = [
    "creation-flags",
    "job-object",
    "kill-on-drop",
    "tokio1",
] }
tokio = { version = "=1.54.1", features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "sync",
    "time",
] }
uuid = { version = "=1.29.0", features = ["v4"] }
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_System_Threading",
] }

# Roadmaps, the registry and the ledger (D-8, D-9, D-11). toml_edit (added at EP-2, the version
# the GUI family already locked) changes the hand-edited registry without losing its comments.
notify = "=8.2.1"
pulldown-cmark = "=0.13.6"
rusqlite = { version = "=0.41.1", features = ["bundled"] }
toml = "=1.1.8"
toml_edit = "=0.25.17"

# Notifications (D-21, D-29; EP-15): the tray icon with its menu (muda, which it re-exports),
# without the Linux backends of its default features. The notices are the window's own popup, in
# place of Windows' toasts (the D-21 addendum).
tray-icon = { version = "=0.26.1", default-features = false }

# The loopback server and the phone pages (D-14, D-28). From EP-12, axum serves the signals with
# HTTP/1.1 and JSON only, on tokio's `net`.
askama = "=0.16.1"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }

anyhow = "=1.0.104"
chrono = "=0.4.45"
serde = { version = "=1.0.229", features = ["derive"] }
# `preserve_order` (EP-12): the owner's Claude Code settings keep their keys' order when the
# signals are installed into them (`indexmap`, which the lock already holds).
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
thiserror = "=2.0.21"
tracing = "=0.1.44"
