[package]
name = "clauderoadmapwrangler"
description = "The desktop dashboard and session launcher (D-14, D-25)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Developer aid: with CRW_SCREENSHOT=<file.png> the app shows fake projects, saves a picture of
# its own frame and exits (CLAUDE.md rule 5; src/screenshot.rs).
screenshot = ["dep:image"]

[dependencies]
# The loopback server the hooks and the status line post to (D-14, D-20, D-28; EP-12).
axum.workspace = true
# The age of a project's last commit, the date of a write's copies.
chrono.workspace = true
crw-core.workspace = true
eframe.workspace = true
egui_material_icons.workspace = true
egui_tiles.workspace = true
image = { workspace = true, optional = true }
# The data root's top level, watched for folders that appear or go (D-7).
notify.workspace = true
serde.workspace = true
# The loopback server's small runtime of its own (EP-12).
tokio.workspace = true
# The tray icon and its menu (D-21, D-29; EP-15).
tray-icon.workspace = true
