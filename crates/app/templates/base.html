<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="same-origin">
<title>{% block title %}Roadmap Wrangler{% endblock %}</title>
<link rel="stylesheet" href="/m/app.css">
<script src="/m/app.js" defer></script>
</head>
<body>
<header class="top">
<a class="home" href="/m/">Roadmap Wrangler</a>
<a class="nav" href="/m/decisions">Decisions</a>
<span class="as-of">{% block as_of %}{% endblock %}</span>
</header>
<main data-listen="{% block listen %}{% endblock %}" data-version="{% block version %}{% endblock %}">
{% block content %}{% endblock %}
</main>
</body>
</html>
