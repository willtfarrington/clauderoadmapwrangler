[package]
name = "crw-core"
description = "The model and engines of clauderoadmapwrangler, without UI types (D-14)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Dates for backups and the age of a project's last commit.
chrono.workspace = true
# The ledger (D-8).
rusqlite.workspace = true
# The registry: read strictly through serde, changed in place through toml_edit (D-8).
serde.workspace = true
toml.workspace = true
toml_edit.workspace = true
# VS Code's list of installed extensions for `doctor`; strings in the workspace file; the stream-json
# a session speaks.
serde_json.workspace = true
thiserror.workspace = true
# The session runner (EP-9): the protocol's types, the child in a job object, a small runtime per
# session, the pre-assigned session id.
claude-codes.workspace = true
process-wrap.workspace = true
tokio.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
# The session child's no-window flag, as process-wrap's creation-flags wrapper takes it.
windows.workspace = true

# The stand-in `claude` the runner's tests start, never the real CLI (D-29). A binary target, so
# that integration tests find it through `CARGO_BIN_EXE_stub-claude`; its source sits with them.
[[bin]]
name = "stub-claude"
path = "tests/stub_claude/stub.rs"
test = false
doc = false
